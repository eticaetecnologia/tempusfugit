name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Copy jsPDF bundle to web/
        run: |
          mkdir -p web
          cp node_modules/jspdf/dist/jspdf.umd.min.js web/jspdf.umd.min.js

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk tempusfugit.apk

      - name: Publish APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Tempus Fugit – última versão"
          body: |
            Versão mais recente do Tempus Fugit para Android.

            **Instalação:**
            1. Baixe o arquivo `tempusfugit.apk` abaixo
            2. No Android, vá em Configurações → Segurança → Instalar apps desconhecidos
            3. Abra o arquivo baixado e instale
          files: tempusfugit.apk
          prerelease: false
          make_latest: true
